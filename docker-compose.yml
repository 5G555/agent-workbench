# docker-compose.yml — 本项目本地开发依赖
# 启动：docker compose up -d
# 所有变量从同目录 .env 读取（docker compose 自动加载 .env）

services:
  # ── PostgreSQL（对外 5434，EduAgent 占 5433、本机 5432）──
  postgres:
    image: postgres:15-alpine
    container_name: myagent_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGTZ: Asia/Shanghai
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
