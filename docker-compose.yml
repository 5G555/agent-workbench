# docker-compose.yml — 本项目本地开发依赖
# 启动：docker compose up -d
# 所有变量从同目录 .env 读取（docker compose 自动加载 .env）

services:
  # ── PostgreSQL（对外 5434，EduAgent 占 5433、本机 5432）──
  postgres:
    image: postgres:15-alpine
    container_name: myagent_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGTZ: Asia/Shanghai
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Milvus 依赖：etcd（元数据，仅内部访问）──
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: myagent_etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >
      etcd
      --advertise-client-urls=http://etcd:2379
      --listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    volumes:
      - etcd_data:/etcd

  # ── Milvus 依赖：MinIO（向量文件存储，仅内部访问）──
  minio:
    image: minio/minio:latest
    container_name: myagent_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Milvus 向量库（对外 19532，EduAgent 占 19531、本机 19530）──
  # 用本地已有的 v2.4.4 镜像，不额外下载
  milvus:
    image: milvusdb/milvus:v2.4.4
    container_name: myagent_milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MILVUS_PORT}:19530"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_started
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ── 应用本体（默认不启动，用 --profile app 才拉起来）──
  # 启动：docker compose --profile app up -d --build
  # Redis 用宿主机的（6379），通过 host.docker.internal 访问
  app:
    build:
      context: .
      args:
        TORCH_INDEX: ${TORCH_INDEX:-https://mirrors.aliyun.com/pytorch-wheels/cpu}
    image: myagent:${APP_TAG:-dev}
    container_name: myagent_app
    restart: unless-stopped
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
      milvus:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # 容器内用服务名，不是 localhost
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      REDIS_URL: redis://host.docker.internal:6379/0
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      APP_ENV: ${APP_ENV:-local}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      # 模型走挂载，不进镜像
      BGE_M3_MODEL_PATH: /models/embedding/bge-m3
      RERANKER_MODEL_PATH: /models/reranker/bge-reranker-large
      QUERY_CLASSIFIER_MODEL_PATH: /models/classifier/bert_query_classifier_ft
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - D:/AI-Models:/models:ro
      - ./var:/app/var

volumes:
  postgres_data:
  etcd_data:
  minio_data:
  milvus_data:
