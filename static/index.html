<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Myagent · 智能问答</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1c2029; --border: #262b36;
    --text: #e6e8ec; --muted: #8b93a7; --accent: #4f8cff;
    --user: #1f2937; --assistant: #141a24;
    --faq: #2e7d5b; --rag: #2f6f9f; --direct: #6b5b95;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 14.5px;
  }

  /* ── 侧边栏 ── */
  aside {
    width: 260px; flex: 0 0 260px; background: var(--panel); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; min-height: 0;
  }
  aside .brand { padding: 16px 16px 12px; font-weight: 600; font-size: 15px; }
  aside .brand small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; margin-top: 4px; }
  aside .actions { padding: 0 12px 12px; display: flex; gap: 8px; }
  aside button {
    flex: 1; height: 34px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel2); color: var(--text); cursor: pointer; font-size: 13px;
  }
  aside button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .sessions { flex: 1; overflow-y: auto; padding: 0 8px 12px; }
  .session {
    padding: 9px 10px; border-radius: 8px; cursor: pointer; margin-bottom: 4px;
    display: flex; flex-direction: column; gap: 2px; border: 1px solid transparent;
  }
  .session:hover { background: var(--panel2); }
  .session.active { background: var(--panel2); border-color: var(--accent); }
  .session .t { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .session .m { font-size: 11px; color: var(--muted); }
  .session .del { float: right; color: var(--muted); font-size: 12px; }
  .session .del:hover { color: #ff6b6b; }
  .empty { color: var(--muted); font-size: 12px; padding: 12px; text-align: center; }

  /* ── 主区 ── */
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  header {
    display: flex; align-items: center; gap: 12px; padding: 12px 20px;
    border-bottom: 1px solid var(--border); background: var(--panel);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .spacer { flex: 1; }
  header .meta { font-size: 12px; color: var(--muted); }
  select {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 8px; font-size: 13px; max-width: 200px;
  }
  .pill {
    font-size: 12px; padding: 4px 10px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--border); color: var(--muted); background: transparent;
  }
  .pill.active { border-color: var(--accent); color: var(--accent); }

  #chat { flex: 1; overflow-y: auto; padding: 20px; }
  .row { display: flex; margin-bottom: 18px; }
  .row.user { justify-content: flex-end; }
  .bubble {
    max-width: min(760px, 82%); padding: 12px 16px; border-radius: 12px;
    line-height: 1.68; word-break: break-word; border: 1px solid var(--border);
  }
  .user .bubble { background: var(--user); white-space: pre-wrap; }
  .assistant .bubble { background: var(--assistant); }
  .bubble h1, .bubble h2, .bubble h3 { font-size: 15px; margin: 10px 0 6px; }
  .bubble p { margin: 6px 0; }
  .bubble ul, .bubble ol { margin: 6px 0; padding-left: 20px; }
  .bubble li { margin: 3px 0; }
  .bubble code {
    background: #0b0e13; border: 1px solid var(--border); border-radius: 4px;
    padding: 1px 5px; font-family: Consolas, monospace; font-size: 13px;
  }
  .bubble pre {
    background: #0b0e13; border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; overflow-x: auto; margin: 8px 0;
  }
  .bubble pre code { border: none; padding: 0; background: none; }

  .tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; margin-bottom: 8px; color: #fff; }
  .tag.faq { background: var(--faq); }
  .tag.rag { background: var(--rag); }
  .tag.llm_direct { background: var(--direct); }
  .tag.web { background: var(--rag); }
  .tag.no_result { background: #6b6b6b; }
  .note { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .sources { margin-top: 10px; font-size: 12px; color: var(--muted); }
  .sources span { display: inline-block; border: 1px solid var(--border); border-radius: 6px; padding: 1px 6px; margin: 2px 4px 0 0; }
  .tools { margin-top: 8px; display: flex; gap: 10px; opacity: 0; transition: opacity .15s; }
  .assistant:hover .tools { opacity: 1; }
  .tools button { background: none; border: none; color: var(--muted); font-size: 12px; cursor: pointer; padding: 0; }
  .tools button:hover { color: var(--accent); }

  footer { border-top: 1px solid var(--border); padding: 14px 20px; background: var(--panel); }
  .inputbar { display: flex; gap: 10px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; min-height: 44px; max-height: 160px; padding: 12px 14px;
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; font-size: 14.5px; font-family: inherit; outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  button.send, button.stop {
    height: 44px; padding: 0 20px; border-radius: 10px; border: none; font-size: 14px; cursor: pointer;
  }
  button.send { background: var(--accent); color: #fff; }
  button.stop { background: #b3261e; color: #fff; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .cursor::after { content: "▋"; animation: blink 1s steps(1) infinite; color: var(--accent); }
  @keyframes blink { 50% { opacity: 0; } }

  /* 移动端：侧边栏变抽屉 */
  .menu-btn { display: none; width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel2); color: var(--text); cursor: pointer; font-size: 16px; }
  .backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 40; }
  .backdrop.show { display: block; }
  @media (max-width: 760px) {
    aside {
      position: fixed; left: 0; top: 0; bottom: 0; z-index: 41; width: 78vw; max-width: 300px;
      transform: translateX(-102%); transition: transform .2s ease;
    }
    aside.open { transform: translateX(0); }
    .menu-btn { display: block; }
    header { padding: 10px 12px; gap: 8px; }
    header h1 { font-size: 14px; max-width: 34vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    header .meta { display: none; }
    #chat { padding: 12px; }
    .bubble { max-width: 92%; font-size: 14px; }
    footer { padding: 10px 12px; }
    .hint { display: none; }
    .tools { opacity: 1; }
  }

  /* 登录遮罩 */
  .overlay { position: fixed; inset: 0; background: rgba(10,12,16,.9); display: flex; align-items: center; justify-content: center; z-index: 50; }
  .overlay.hidden { display: none; }
  .card { width: 330px; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
  .card h2 { margin: 0; font-size: 17px; }
  .card input { height: 40px; padding: 0 12px; border-radius: 8px; background: var(--bg); color: var(--text); border: 1px solid var(--border); outline: none; font-size: 14px; }
  .card input:focus { border-color: var(--accent); }
  .card .row2 { display: flex; gap: 10px; }
  .card button { flex: 1; height: 40px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--text); cursor: pointer; font-size: 14px; }
  .card button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .card .err { font-size: 12px; color: #ff6b6b; min-height: 16px; }
</style>
</head>
<body>

<aside>
  <div class="brand">Myagent<small>企业知识库问答</small></div>
  <div class="actions">
    <button class="primary" id="newSession">＋ 新会话</button>
    <button id="logoutBtn">退出</button>
  </div>
  <div class="sessions" id="sessions"></div>
</aside>

<main>
  <header>
    <button class="menu-btn" id="menuBtn" title="会话列表">☰</button>
    <h1 id="title">新会话</h1>
    <span class="meta" id="meta">连接中…</span>
    <span class="spacer"></span>
    <select id="mode" title="回答模式">
      <option value="auto">自动（推荐）</option>
      <option value="qa">知识库问答</option>
      <option value="research">联网研究</option>
    </select>
    <select id="source"><option value="">全部来源</option></select>
    <button class="pill active" id="streamToggle">流式：开</button>
  </header>

  <div id="chat"></div>

  <footer>
    <div class="inputbar">
      <textarea id="input" placeholder="问点什么，比如：你们怎么收费 / 扫描版 PDF 怎么导入"></textarea>
      <button class="send" id="send">发送</button>
      <button class="stop" id="stop" style="display:none">停止</button>
    </div>
    <div class="hint">回车发送，Shift+回车换行。答案会标注命中方式（FAQ / 知识库检索 / 直接回答）。</div>
  </footer>
</main>

<div class="backdrop" id="backdrop"></div>

<div class="overlay hidden" id="login">
  <div class="card">
    <h2>登录 Myagent</h2>
    <input id="lu" placeholder="用户名（3 位以上）" autocomplete="username" />
    <input id="lp" type="password" placeholder="密码（6 位以上）" autocomplete="current-password" />
    <div class="row2">
      <button class="primary" id="loginBtn">登录</button>
      <button id="registerBtn">注册</button>
    </div>
    <div class="err" id="lerr"></div>
  </div>
</div>

<script>
"use strict";
const API = "/api/v1/qa";
const API_RESEARCH = "/api/v1/research";
const AUTH = "/api/v1/auth";

const $ = (id) => document.getElementById(id);
const chat = $("chat"), input = $("input"), sendBtn = $("send"), stopBtn = $("stop");
const meta = $("meta"), title = $("title"), sourceSel = $("source"), modeSel = $("mode");
const sessionsBox = $("sessions"), streamToggle = $("streamToggle");
const loginBox = $("login"), lerr = $("lerr"), lu = $("lu"), lp = $("lp");

let streaming = true;
let busy = false;
let abortCtl = null;
let currentSession = "";
// sid → 标题，供 openSession 复用（避免把 session_id 当标题显示）
const sessionTitles = new Map();

// ── 令牌管理 ───────────────────────────────────────────
const store = {
  get access() { return localStorage.getItem("qa_access") || ""; },
  get refresh() { return localStorage.getItem("qa_refresh") || ""; },
  save(d) {
    localStorage.setItem("qa_access", d.access_token || "");
    if (d.refresh_token) localStorage.setItem("qa_refresh", d.refresh_token);
    if (d.user_id) localStorage.setItem("qa_user", d.user_id);
  },
  clear() {
    ["qa_access", "qa_refresh", "qa_user"].forEach(k => localStorage.removeItem(k));
  },
};

let refreshPromise = null;

async function refreshAccess() {
  // 并发请求同时 401 时，只发一次 refresh
  if (refreshPromise) return refreshPromise;
  refreshPromise = (async () => {
    const rt = store.refresh;
    if (!rt) return false;
    try {
      const res = await fetch(`${AUTH}/refresh`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ refresh_token: rt }),
      });
      if (!res.ok) return false;
      store.save(await res.json());
      return true;
    } catch (e) {
      return false;
    } finally {
      refreshPromise = null;
    }
  })();
  return refreshPromise;
}

async function apiFetch(url, opts) {
  const options = Object.assign({}, opts || {});
  const headers = Object.assign({}, options.headers || {});
  if (store.access) headers["Authorization"] = "Bearer " + store.access;
  options.headers = headers;

  let res = await fetch(url, options);
  if (res.status === 401) {
    if (await refreshAccess()) {
      headers["Authorization"] = "Bearer " + store.access;
      res = await fetch(url, options);
    }
    if (res.status === 401) {
      store.clear();
      showLogin("登录已失效，请重新登录");
      throw new Error("unauthenticated");
    }
  }
  return res;
}

// ── 登录 ───────────────────────────────────────────────
function showLogin(msg) { loginBox.classList.remove("hidden"); lerr.textContent = msg || ""; lu.focus(); }
function hideLogin() { loginBox.classList.add("hidden"); }

async function doAuth(path) {
  const username = lu.value.trim(), password = lp.value;
  if (username.length < 3 || password.length < 6) { lerr.textContent = "用户名至少 3 位，密码至少 6 位"; return; }
  try {
    const res = await fetch(`${AUTH}/${path}`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password }),
    });
    const data = await res.json();
    if (!res.ok) { lerr.textContent = data.detail || "失败"; return; }
    store.save(data);
    lp.value = "";
    hideLogin();
    await boot();
  } catch (e) { lerr.textContent = "请求失败：" + e.message; }
}
$("loginBtn").onclick = () => doAuth("login");
$("registerBtn").onclick = () => doAuth("register");
lp.addEventListener("keydown", (e) => { if (e.key === "Enter") doAuth("login"); });

$("logoutBtn").onclick = async () => {
  try {
    await fetch(`${AUTH}/logout`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ refresh_token: store.refresh }),
    });
  } catch (e) { /* 忽略 */ }
  store.clear();
  chat.innerHTML = "";
  sessionsBox.innerHTML = "";
  showLogin("已退出");
};

// ── Markdown 轻量渲染（先转义，防 XSS）─────────────────
function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function renderMarkdown(text) {
  let html = escapeHtml(text);
  html = html.replace(/```([\s\S]*?)```/g, (_, code) => `<pre><code>${code.trim()}</code></pre>`);
  html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
  html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  html = html.replace(/^### (.+)$/gm, "<h3>$1</h3>");
  html = html.replace(/^## (.+)$/gm, "<h2>$1</h2>");
  html = html.replace(/^# (.+)$/gm, "<h1>$1</h1>");

  const lines = html.split("\n");
  const out = [];
  let list = null;
  for (const line of lines) {
    const ol = /^\s*\d+\.\s+(.*)$/.exec(line);
    const ul = /^\s*[-*]\s+(.*)$/.exec(line);
    if (ol) { if (list !== "ol") { if (list) out.push(`</${list}>`); out.push("<ol>"); list = "ol"; } out.push(`<li>${ol[1]}</li>`); continue; }
    if (ul) { if (list !== "ul") { if (list) out.push(`</${list}>`); out.push("<ul>"); list = "ul"; } out.push(`<li>${ul[1]}</li>`); continue; }
    if (list) { out.push(`</${list}>`); list = null; }
    if (/^<h[123]>/.test(line) || /^<pre>/.test(line) || !line.trim()) out.push(line);
    else out.push(`<p>${line}</p>`);
  }
  if (list) out.push(`</${list}>`);
  return out.join("\n");
}

// ── 消息渲染 ───────────────────────────────────────────
function addRow(role, text, streaming_) {
  const row = document.createElement("div");
  row.className = "row " + role;
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  if (role === "user") bubble.textContent = text;
  else if (text) bubble.innerHTML = renderMarkdown(text);
  if (streaming_) bubble.classList.add("cursor");
  row.appendChild(bubble);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
  return bubble;
}

function renderMeta(bubble, mode, sources, note) {
  bubble.querySelectorAll(".tag, .sources, .tools, .note").forEach(n => n.remove());
  const labels = {
    faq: "FAQ 命中", rag: "知识库检索", llm_direct: "直接回答",
    web: "联网检索", no_result: "未找到",
  };
  if (mode) {
    const tag = document.createElement("div");
    tag.className = "tag " + mode;
    tag.textContent = labels[mode] || mode;
    bubble.prepend(tag);
  }
  if (note) {
    const n = document.createElement("div");
    n.className = "note";
    n.textContent = note;
    bubble.insertBefore(n, mode ? bubble.children[1] || null : bubble.firstChild);
  }
  if (sources && sources.length) {
    const box = document.createElement("div");
    box.className = "sources";
    box.textContent = "来源：";
    sources.forEach(s => {
      const chip = document.createElement("span");
      chip.textContent = s;
      box.appendChild(chip);
    });
    bubble.appendChild(box);
  }
  const tools = document.createElement("div");
  tools.className = "tools";

  const up = document.createElement("button");
  up.textContent = "👍 有帮助";
  up.onclick = () => sendFeedback(bubble, 1, up, down);
  const down = document.createElement("button");
  down.textContent = "👎 没帮助";
  down.onclick = () => sendFeedback(bubble, -1, up, down);

  const copy = document.createElement("button");
  copy.textContent = "复制";
  copy.onclick = () => { navigator.clipboard.writeText(bubble.innerText.trim()); copy.textContent = "已复制"; setTimeout(() => copy.textContent = "复制", 1200); };

  tools.appendChild(up);
  tools.appendChild(down);
  tools.appendChild(copy);
  bubble.appendChild(tools);
}

async function sendFeedback(bubble, rating, upBtn, downBtn) {
  const answer = bubble.innerText.replace(/^.*?(FAQ 命中|知识库检索|直接回答)/, "").trim();
  try {
    await apiFetch(`${API}/feedback`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: currentSession, rating, answer }),
    });
    upBtn.style.color = rating === 1 ? "#2e7d5b" : "";
    downBtn.style.color = rating === -1 ? "#b3261e" : "";
    upBtn.textContent = rating === 1 ? "👍 已反馈" : "👍 有帮助";
    downBtn.textContent = rating === -1 ? "👎 已反馈" : "👎 没帮助";
  } catch (e) { /* 反馈失败不影响使用 */ }
}

// ── 会话 ───────────────────────────────────────────────
const aside = document.querySelector("aside");
const backdrop = $("backdrop");
function openDrawer() { aside.classList.add("open"); backdrop.classList.add("show"); }
function closeDrawer() { aside.classList.remove("open"); backdrop.classList.remove("show"); }
$("menuBtn").onclick = () => (aside.classList.contains("open") ? closeDrawer() : openDrawer());
backdrop.onclick = closeDrawer;

function newSessionId() {
  return "s" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

async function loadSessions() {
  try {
    const res = await apiFetch(`${API}/sessions`);
    const list = await res.json();
    sessionsBox.innerHTML = "";
    if (!list.length) { sessionsBox.innerHTML = '<div class="empty">还没有会话</div>'; return; }
    sessionTitles.clear();
    list.forEach(item => {
      sessionTitles.set(item.session_id, item.title || "未命名会话");
      const el = document.createElement("div");
      el.className = "session" + (item.session_id === currentSession ? " active" : "");
      const t = document.createElement("div");
      t.className = "t";
      t.textContent = item.title || item.session_id;

      const m = document.createElement("div");
      m.className = "m";
      m.textContent = `${item.messages} 条 · ${new Date(item.last_at).toLocaleString()}`;

      const rename = document.createElement("span");
      rename.className = "del";
      rename.textContent = "✎";
      rename.title = "重命名";
      rename.onclick = async (ev) => {
        ev.stopPropagation();
        const next = prompt("新的会话标题", item.title || item.session_id);
        if (!next || !next.trim()) return;
        await apiFetch(`${API}/sessions/${item.session_id}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ title: next.trim() }),
        });
        if (item.session_id === currentSession) title.textContent = next.trim();
        await loadSessions();
      };

      const del = document.createElement("span");
      del.className = "del";
      del.textContent = "✕";
      del.title = "删除会话";
      del.onclick = async (ev) => {
        ev.stopPropagation();
        await apiFetch(`${API}/history/${item.session_id}`, { method: "DELETE" });
        if (item.session_id === currentSession) startNewSession();
        await loadSessions();
      };

      t.appendChild(rename);
      t.appendChild(del);
      el.appendChild(t);
      el.appendChild(m);
      el.onclick = () => { openSession(item.session_id); closeDrawer(); };
      sessionsBox.appendChild(el);
    });
  } catch (e) { /* 已由 apiFetch 处理 */ }
}

async function openSession(sid) {
  currentSession = sid;
  // 标题优先用会话名；老会话没有标题就用首问，再没有就显示"未命名会话"，
  // 绝不把 session_id 直接甩给用户看（那是一串看不懂的随机字符）。
  title.textContent = sessionTitles.get(sid) || "未命名会话";
  title.dataset.sid = sid;
  chat.innerHTML = "";
  try {
    const res = await apiFetch(`${API}/history/${sid}`);
    const rows = await res.json();
    if (!rows.length) {
      addRow("assistant", "这个会话还没有消息，可以直接输入问题。");
      title.textContent = "新会话";
    }
    rows.forEach(r => {
      const bubble = addRow(r.role === "user" ? "user" : "assistant", r.content);
      if (r.role !== "user") renderMeta(bubble, r.answer_mode, []);
    });
  } catch (e) { /* 忽略 */ }
  loadSessions();
}

function startNewSession() {
  currentSession = newSessionId();
  title.textContent = "新会话";
  delete title.dataset.sid;
  chat.innerHTML = "";
  addRow("assistant", "你好，我是 Myagent 的问答助手。可以问我产品、计费、售后、部署、故障排查相关的问题。");
  loadSessions();
}

// ── 提问 ───────────────────────────────────────────────
async function askStream(message, bubble) {
  abortCtl = new AbortController();
  const mode = modeSel.value;
  const base = mode === "auto" ? "/api/v1" : (mode === "research" ? API_RESEARCH : API);
  const body = { session_id: currentSession, message, source: sourceSel.value || null };
  if (mode === "auto") body.mode = "auto";
  const res = await apiFetch(`${base}/ask/stream`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
    signal: abortCtl.signal,
  });
  if (!res.body) throw new Error("浏览器不支持流式响应");

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "", answer = "", answerMode = "", sources = [], note = "";
  let confirmInfo = null;

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const parts = buffer.split("\n\n");
    buffer = parts.pop() || "";
    for (const part of parts) {
      const line = part.trim();
      if (!line.startsWith("data:")) continue;
      const payload = line.slice(5).trim();
      if (payload === "[DONE]") continue;
      let ev; try { ev = JSON.parse(payload); } catch (e) { continue; }
      if (ev.type === "token") {
        answer += ev.data;
        bubble.innerHTML = renderMarkdown(answer);
        chat.scrollTop = chat.scrollHeight;
      } else if (ev.type === "done") {
        answerMode = ev.mode || answerMode; sources = ev.sources || sources;
        if (ev.answer && !answer) answer = ev.answer;
      } else if (ev.type === "route") {
        note = "自动路由 → " + ev.agent + (ev.reason ? "：" + ev.reason : "");
      } else if (ev.type === "escalate") {
        note = "知识库未命中，已转联网检索";
        answer = "";
      } else if (ev.type === "confirm") {
        confirmInfo = {
          agent: ev.agent, entry_url: ev.entry_url,
          goal: ev.goal, question: ev.question,
        };
      } else if (ev.type === "final") {
        answerMode = ev.mode || answerMode;
        if (ev.answer && !answer) answer = ev.answer;
      } else if (ev.type === "error") {
        answer += `\n\n[出错] ${ev.message}`;
      }
    }
  }
  bubble.classList.remove("cursor");
  bubble.innerHTML = renderMarkdown(answer);
  renderMeta(bubble, answerMode, sources, note);
  if (confirmInfo) renderConfirm(bubble, confirmInfo);
}

async function askOnce(message, bubble) {
  const mode = modeSel.value;
  const base = mode === "auto" ? "/api/v1" : (mode === "research" ? API_RESEARCH : API);
  const body = { session_id: currentSession, message, source: sourceSel.value || null };
  if (mode === "auto") body.mode = "auto";
  const res = await apiFetch(`${base}/ask`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const data = await res.json();
  bubble.innerHTML = renderMarkdown(data.answer || data.error_msg || "（无回答）");
  // /api/v1/ask 返回扁平结构，/v1/qa 返回 {structured:{answer_mode}}
  const answerMode = data.answer_mode || (data.structured && data.structured.answer_mode) || "";
  let note = "";
  if (data.escalated) note = "知识库未命中，已转联网检索";
  else if (data.route && data.route.agent) note = "自动路由 → " + data.route.agent;
  renderMeta(bubble, answerMode, data.sources || [], note);
  if (data.need_confirm && data.confirm) renderConfirm(bubble, data.confirm);
  if (data.task_id) renderExport(bubble, data.task_id);
}

// 采集完成后给"导出为文件"按钮：数据本来在库里，想要文件时再落盘
function renderExport(bubble, taskId) {
  const box = document.createElement("div");
  box.className = "tools";
  const btn = document.createElement("button");
  btn.textContent = "📁 导出为文件";
  btn.onclick = async () => {
    btn.disabled = true;
    btn.textContent = "正在导出…";
    try {
      const res = await apiFetch(`/api/v1/crawler/export/${taskId}`, { method: "POST" });
      const data = await res.json();
      if (data.success) {
        addRow("assistant", `已导出到：\n\`${data.directory}\`\n\n` +
          `页面 ${data.pages} 个 / 结构化记录 ${data.records} 条 / ` +
          `${(data.bytes_written / 1024).toFixed(1)} KB`);
      } else {
        addRow("assistant", "导出失败：" + (data.error_msg || "未知原因"));
      }
    } catch (e) {
      addRow("assistant", "导出失败：" + e.message);
    } finally {
      btn.disabled = false;
      btn.textContent = "📁 导出为文件";
    }
  };
  box.appendChild(btn);
  bubble.appendChild(box);
}

// 采集类意图的确认：有入口 URL 才给"确认抓取"，否则只是提示用户补 URL
function renderConfirm(bubble, info) {
  const box = document.createElement("div");
  box.className = "tools";
  if (info.entry_url) {
    const ok = document.createElement("button");
    ok.textContent = "✅ 确认抓取";
    ok.onclick = async () => {
      box.remove();
      const target = addRow("assistant", "正在抓取，请稍候…");
      try {
        const res = await apiFetch("/api/v1/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            session_id: currentSession,
            message: info.goal || "抓取页面",
            mode: "crawler",
            entry_url: info.entry_url,
            goal: info.goal || "",
          }),
        });
        const data = await res.json();
        target.innerHTML = renderMarkdown(data.answer || data.error_msg || "（无输出）");
        renderMeta(target, data.answer_mode || "", [], "已执行采集");
        if (data.task_id) renderExport(target, data.task_id);
      } catch (e) {
        target.textContent = "抓取失败：" + e.message;
      }
    };
    box.appendChild(ok);
  }
  const cancel = document.createElement("button");
  cancel.textContent = "取消";
  cancel.onclick = () => { box.remove(); addRow("assistant", "好的，已取消。"); };
  box.appendChild(cancel);
  bubble.appendChild(box);
}

async function send() {
  const message = input.value.trim();
  if (!message || busy) return;
  busy = true; sendBtn.disabled = true; stopBtn.style.display = "";
  input.value = ""; input.style.height = "44px";
  if (!currentSession) currentSession = newSessionId();
  // 新会话的首问直接当标题显示，不用等接口回来
  if (title.textContent === "新会话") title.textContent = message.slice(0, 24);

  addRow("user", message);
  const bubble = addRow("assistant", "", true);
  try {
    if (streaming) await askStream(message, bubble);
    else await askOnce(message, bubble);
  } catch (e) {
    bubble.classList.remove("cursor");
    bubble.textContent = e.name === "AbortError" ? "（已停止）" : "请求失败：" + e.message;
  } finally {
    busy = false; sendBtn.disabled = false; stopBtn.style.display = "none"; abortCtl = null;
    input.focus();
    loadSessions();
  }
}

// ── 交互绑定 ───────────────────────────────────────────
sendBtn.onclick = send;
stopBtn.onclick = () => { if (abortCtl) abortCtl.abort(); };
input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
input.addEventListener("input", () => { input.style.height = "44px"; input.style.height = Math.min(input.scrollHeight, 160) + "px"; });
streamToggle.onclick = () => { streaming = !streaming; streamToggle.textContent = "流式：" + (streaming ? "开" : "关"); streamToggle.classList.toggle("active", streaming); };
modeSel.onchange = () => {
  const isResearch = modeSel.value === "research";
  sourceSel.style.display = isResearch ? "none" : "";
  input.placeholder = isResearch
    ? "问一个需要联网查证的问题，比如：LangGraph 1.x 有哪些新特性"
    : "问点什么，比如：你们怎么收费 / 扫描版 PDF 怎么导入";
};
$("newSession").onclick = startNewSession;

async function loadSources() {
  try {
    const res = await apiFetch(`${API}/sources`);
    const list = await res.json();
    sourceSel.innerHTML = '<option value="">全部来源</option>';
    list.forEach(s => { const o = document.createElement("option"); o.value = s; o.textContent = s; sourceSel.appendChild(o); });
  } catch (e) { /* 忽略 */ }
}

async function health() {
  try {
    const res = await fetch("/health");
    const d = await res.json();
    meta.textContent = `${d.env} · Milvus ${d.milvus} · 缓存${d.cache_enabled ? "开" : "关"}`;
  } catch (e) { meta.textContent = "服务不可用"; }
}

async function boot() {
  await health();
  await loadSources();
  if (currentSession) await openSession(currentSession);
  else startNewSession();
}

(function init() {
  health();
  if (!store.access || !store.refresh) { showLogin("请先登录"); return; }
  boot().catch(() => {});
})();
</script>
